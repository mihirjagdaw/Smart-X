services:
  smart-x-api:
    build:
      context: .
      dockerfile: Smart-X.Api/Dockerfile
    ports:
      - "5256:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__SmartXDb=Data Source=/app/data/smartx.db
      # The simulator posts readings to the API's own port inside the container (8080), not the published 5256.
      - Simulator__ApiBaseUrl=http://localhost:8080
    volumes:
      - ./docker-data/db:/app/data
      - ./docker-data/uploads:/app/uploads

  smart-x-client:
    build:
      context: .
      dockerfile: Smart-X.Client/Dockerfile
    ports:
      - "5128:80"
    depends_on:
      - smart-x-api

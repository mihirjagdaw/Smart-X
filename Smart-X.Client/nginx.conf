server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Blazor client-side routing: any unmatched path falls back to index.html
    # so direct navigation to e.g. /ingestion or /sensors works.
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
